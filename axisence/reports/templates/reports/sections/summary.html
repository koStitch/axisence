<section>
  <h2>Summary</h2>
  <table class="summary">
    <tbody>
      {% for row in report.summary.rows %}
        <tr><th scope="row">{{ row.label }}</th><td>{{ row.value }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  {% for note in report.summary.notes %}
    <p class="note">{{ note }}</p>
  {% endfor %}
</section>
